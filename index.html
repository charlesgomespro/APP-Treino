<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mjölnir — Caderno de Treino</title>

<!-- Configurações de PWA -->
<meta name="theme-color" content="#0A0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mjölnir">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0A0E13; --surface:#131B24; --surface-2:#1C2633; --ink:#F0F4F8; --muted:#8A9BA8; --line:#273546;
  --accent:#3B82F6; --accent-ink:#FFFFFF; --accent-soft:#1E293B;
  --ok:#10B981; --ok-soft:#064E3B; --warn:#F59E0B; --warn-soft:#451A03; --bad:#EF4444; --bad-soft:#450A0A;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-block:18px 130px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1;letter-spacing:.03em;text-transform:uppercase}
h1{font-size:36px;color:#FFFFFF}
h2{font-size:24px;margin-top:28px;margin-bottom:8px;color:#E2E8F0}
h3{font-size:21px;font-weight:600}
p{margin:0}
.sub{color:var(--muted);margin-top:4px;font-size:15px;letter-spacing:.05em}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:0 4px 6px -1px rgba(0,0,0,0.3)}
.muted{color:var(--muted)}
small{font-size:13px;color:var(--muted)}
a{color:var(--accent)}
.note{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:15px;margin-top:12px}
.note.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}

/* Cronômetro flutuante */
#timer-bar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:8;
  background:var(--surface);border-top:2px solid var(--accent);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -6px 16px rgba(0,0,0,0.5)}
#timer-bar.hidden{display:none}
.timer-info{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent)}
.timer-actions{display:flex;gap:8px}

/* abas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav a{flex:1;text-align:center;padding:13px 4px 12px;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.08em;
  text-transform:uppercase;text-decoration:none;color:var(--muted)}
.nav a[aria-current="page"]{color:var(--accent);background:var(--surface-2);box-shadow:inset 0 3px 0 var(--accent)}
.nav a:focus-visible,.btn:focus-visible,.chip:focus-visible,.tipbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* botões */
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:var(--r);
  padding:12px 16px;min-height:46px;cursor:pointer;transition:all .1s ease}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#2563EB}
.btn.danger{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.timer-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.timer-presets span{font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* escolha do dia */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.chip{font-family:var(--font-display);font-weight:700;font-size:24px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r);padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-height:65px;justify-content:center}
.chip small{font-family:var(--font-body);font-weight:500;line-height:1.1;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:var(--accent-ink)}
.chip:disabled{opacity:.35;cursor:default}
.meta{margin-top:12px;color:var(--muted);font-weight:500}

/* exercício */
.ex-head{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.ex-head h3{flex:1 1 200px;min-width:0;color:#FFFFFF}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:3px 8px;color:var(--muted);white-space:nowrap;background:var(--surface-2)}
.tag.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.tag.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.tag.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.eqrow{display:flex;gap:10px;align-items:center;margin-top:10px}
.eqrow label{font-size:14px;color:var(--muted);flex:none}
.sug{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--surface-2);font-size:14px;border-left:3px solid var(--accent)}
.sug.up{background:var(--ok-soft);border-left-color:var(--ok)}
.sug.bulge{background:var(--warn-soft);border-left-color:var(--warn)}
.sets{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.sl{min-width:0}
.sl b{display:block;font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.1;letter-spacing:.03em;color:#E2E8F0}
.sl span{display:block;font-size:12px;color:var(--muted);line-height:1.25;margin-top:2px}
.si{display:grid;grid-template-columns:85px 14px 85px 46px;gap:6px;align-items:center}
.si .x{color:var(--muted);text-align:center}
input[type=text],select,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;min-width:0}
input.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;padding:10px 4px}
textarea{resize:vertical;line-height:1.4}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.sets-actions{display:flex;gap:8px;margin-top:12px}
.tipbtn{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;margin-top:12px;padding:10px 0 2px;font:inherit;font-weight:600;font-size:14px;
  color:var(--accent);background:none;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:
