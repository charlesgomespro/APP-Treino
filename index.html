<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mjölnir Treino</title>
<meta name="theme-color" content="#0D0B09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mjölnir">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Cinzel:wght@600;700&display=swap">
<style>
/* Layout: app de celular, uma coluna, barra de abas fixa embaixo.
   Cartões só onde há ação (exercício); o resto é texto corrido com régua fina. */
:root{
  --bg:#0D0B09; --surface:#1A1612; --surface-2:#261F18; --ink:#EFE6D6; --muted:#A99C89; --line:#3D3226;
  --accent:#D0A03A; --accent-ink:#17110A; --accent-soft:#3A2C12;
  --ok:#7CC57F; --ok-soft:#18301B; --warn:#E5A83F; --warn-soft:#38280E; --bad:#E8685A; --bad-soft:#3C1A16;
  --iron:#6E7F8C;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-norse:'Cinzel',Georgia,'Times New Roman',serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#2A2014 0%,rgba(13,11,9,0) 60%);background-attachment:fixed;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-block:18px 190px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
h1{font-family:var(--font-norse);font-size:38px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);text-shadow:0 2px 0 #000}
.runes{font-size:18px;letter-spacing:.5em;color:var(--iron);margin-top:6px}
.runes+.sub{margin-top:8px}
header{padding-bottom:12px;border-bottom:2px solid var(--line);border-image:linear-gradient(90deg,var(--accent),var(--line) 70%,transparent) 1}
h2{font-family:var(--font-norse);font-size:19px;letter-spacing:.06em;text-transform:uppercase;margin-top:28px;margin-bottom:8px;color:var(--accent)}
h2::before{content:'ᛟ ';color:var(--iron)}
h3{font-size:21px;font-weight:600}
p{margin:0}
.sub{color:var(--muted);margin-top:4px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--r);padding:14px;min-width:0;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.muted{color:var(--muted)}
small{font-size:13px;color:var(--muted)}
a{color:var(--accent)}
.note{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:15px;margin-top:12px}
.note.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}

/* abas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav a{font-family:var(--font-norse)!important;font-size:14px!important;flex:1;text-align:center;padding:13px 4px 12px;font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:.06em;
  text-transform:uppercase;text-decoration:none;color:var(--muted)}
.nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.nav a:focus-visible,.btn:focus-visible,.chip:focus-visible,.tipbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* botões */
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);
  padding:12px 16px;min-height:46px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:40px;padding:8px 12px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* escolha do dia */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.chip{font-family:var(--font-display);font-weight:700;font-size:24px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r);padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-height:60px;justify-content:center}
.chip small{font-family:var(--font-body);font-weight:500;line-height:1.1}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:var(--accent-ink)}
.chip:disabled{opacity:.45;cursor:default}
.meta{margin-top:12px;color:var(--muted)}

/* exercício */
.ex-head{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.ex-head h3{flex:1 1 200px;min-width:0}
.tag{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--muted);white-space:nowrap}
.tag.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.tag.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.tag.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.eqrow{display:flex;gap:10px;align-items:center;margin-top:10px}
.eqrow label{font-size:14px;color:var(--muted);flex:none}
.sug{margin-top:10px;padding:8px 10px;border-radius:6px;background:var(--surface-2);font-size:15px}
.sug.up{background:var(--ok-soft)}
.sug.bulge{background:var(--warn-soft)}
.sets{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.sl{min-width:0}
.sl b{display:block;font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.1}
.sl span{display:block;font-size:13px;color:var(--muted);line-height:1.25;margin-top:2px}
.si{display:grid;grid-template-columns:80px 14px 80px;gap:6px;align-items:center}
.si .x{color:var(--muted);text-align:center}
input[type=text],select,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;min-width:0}
input.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:20px;padding:10px 4px}
textarea{resize:vertical;line-height:1.4}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:15px}
.chk input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.sets-actions{display:flex;gap:8px;margin-top:10px}
.warm{margin-top:12px;font-size:15px}
.tipbtn{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;margin-top:10px;padding:10px 0 2px;font:inherit;font-weight:600;font-size:15px;
  color:var(--accent);background:none;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left}
.tipbtn small{font-weight:400}
.tip{margin-top:6px;font-size:15px}
.tipc{margin-top:6px;color:var(--warn)}

/* plano */
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.list{list-style:none;margin:10px 0 0;padding:0}
.list li{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .nm{min-width:0;flex:1}
.list .nm small{display:block;margin-top:2px}
.list .sr{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}

/* cronômetro de descanso */
#timer-bar{position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--surface-2);border-top:2px solid var(--accent);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 16px rgba(0,0,0,.6)}
#timer-bar.hidden{display:none}
.t-in{max-width:720px;margin:0 auto}
.t-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#timer-label{font-family:var(--font-norse);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#timer-display{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
#timer-bar.done #timer-display{color:var(--ok)}
#timer-bar.done{border-top-color:var(--ok)}
.t-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.t-btns .btn{min-height:42px;padding:6px 10px;flex:1 1 auto}
.t-btns .sep{flex:0 0 100%;height:0}

/* regras */
.rule{border-top:1px solid var(--line);padding:14px 0}
.rule:first-of-type{border-top:0}
.rule h3{margin-bottom:6px}
.rule .why{margin-top:6px;font-size:15px;color:var(--muted)}
.src{margin:8px 0 0;padding-left:18px;font-size:14px}
.rel{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.rel:first-of-type{border-top:0}
.rel input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.rel small{display:block;margin-top:2px}

/* dados */
details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 12px;margin-top:8px}
summary{cursor:pointer;padding:12px 0;font-weight:600}
details .inner{padding-bottom:12px;font-size:15px}
.hist-line{display:flex;gap:10px;justify-content:space-between;padding:4px 0}
.hist-line span:first-child{min-width:0}
.hist-line span:last-child{font-variant-numeric:tabular-nums;text-align:right}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:9;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:500;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){ .btn,.chip{transition:background-color .12s,border-color .12s} }
@media (min-width:560px){ .wrap{padding-top:28px} }
</style>

</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div id="timer-bar" class="hidden" role="timer" aria-label="Cronômetro de descanso"><div class="t-in">
  <div class="t-top"><span id="timer-label">Descanso</span><span id="timer-display">00:00</span></div>
  <div class="t-btns">
    <button type="button" class="btn small" data-t="s60">1:00</button>
    <button type="button" class="btn small" data-t="s90">1:30</button>
    <button type="button" class="btn small" data-t="s120">2:00</button>
    <button type="button" class="btn small" data-t="s180">3:00</button>
    <button type="button" class="btn small" data-t="add">+30 s</button>
    <button type="button" class="btn small primary" id="timer-pause-btn" data-t="pause">Pausar</button>
    <button type="button" class="btn small danger" data-t="stop">Zerar</button>
  </div></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ---------- dados fixos ---------- */
const KEY='caderno-treino-v2';

// Colunas da planilha (semanas 5 a 8). min = minutos por série na estimativa (suposição calibrada: 4 séries x 7 exercícios ~ 1 hora).
const COLS=[
  {id:'f1',nm:'Feeder 1',sh:'F1',min:1.5,info:'6 a 8 repetições na maioria dos exercícios'},
  {id:'f2',nm:'Feeder 2',sh:'F2',min:1.5,info:'5 a 6 repetições na maioria dos exercícios'},
  {id:'w1',nm:'Working 1',sh:'W1',min:2,info:'8 a 12 repetições'},
  {id:'w2',nm:'Working 2',sh:'W2',min:3,info:'cluster na maioria dos exercícios, intervalo de 2 a 3 min'},
  {id:'bo',nm:'Back-off',sh:'BO',min:1.5,info:'10 a 12 repetições (12 a 15 em alguns), intervalo de 1 a 2 min'}
];
const COLN={};COLS.forEach(c=>{COLN[c.id]=c;});
const WARM_MIN=5;
const REST={f1:90,f2:90,w1:120,w2:150,bo:90,fx:60,extra:90};
const LIMIT_MIN=65;

// Restrições de precaução (cirurgia de março/2026 com tela + crista abdominal observada). Ficam ativas até o médico liberar.
const RESTR=[
  {id:'barra',t:'Agachamento livre com barra',why:'Carga alta somada à pressão dentro do abdômen. Com Smith ou hack você treina sem liberar.'},
  {id:'abdominal',t:'Exercícios de abdômen (elevação de membros inferiores e abdominal crunch)',why:'Fazem o meio da barriga abaular, onde você percebe a crista.'}
];

// s = faixa de repetições por coluna, na ordem F1|F2|W1|W2|BO. C = cluster (3 ou 4 blocos de 3 ou 4).
const EQ3=['halter','cabo','máquina'];
const LAB4={f2:'Working 1',w1:'Working 2',w2:'Working 3',bo:'Working 4'};
const EX={
  a1:{n:'Crucifixo inclinado',m:'Peito',eq:EQ3,s:'6-8|5-6|10-12|C|10-12',step:2.5},
  a2:{n:'Supino inclinado',m:'Peito',eq:EQ3,s:'6-8|5-6|10-12|C|10-12',step:2.5},
  a3:{n:'Supino reto',m:'Peito',eq:['Smith','máquina','livre'],s:'6-8|5-6|8-10|C|10-12',step:2.5,caution:true},
  a4:{n:'Supino declinado ou crossover',m:'Peito',eq:EQ3,s:'6-8|5-6|8-10|C|10-12',step:2.5},
  a5:{n:'Elevações laterais',m:'Ombros',eq:EQ3,s:'6-8|5-6|8-10|C|10-12',step:1},
  a6:{n:'Tríceps francês',m:'Tríceps',eq:['cabo','halter','máquina'],s:'6-8|6-8|10-12|C|10-12',step:2.5},
  a7:{n:'Tríceps corda no cabo',m:'Tríceps',s:'6-8|5-6|10-12|C|10-12',step:2.5},
  a8:{n:'Elevação de membros inferiores sentado no banco',m:'Abdômen',fixed:{n:4,t:'15 a 20'},block:'abdominal'},
  b1:{n:'Agachamento',m:'Quadríceps',eq:['Smith','hack','livre'],eqBlock:{livre:'barra'},s:'6-8|5-6|8-10|8-10|10-12',step:5,caution:true},
  b2:{n:'Avanço / afundo',m:'Quadríceps',s:'6-8|5-6|8-10|C|10-12',step:2},
  b3:{n:'Leg press',m:'Quadríceps',s:'6-8|5-6|10-12|C|10-12',step:5},
  b4:{n:'Cadeira extensora',m:'Quadríceps',s:'6-8|5-6|10-12|C|10-12',step:2.5},
  b5:{n:'Mesa / cadeira flexora',m:'Posterior',s:'6-8|5-6|10-12|C|10-12',step:2.5},
  b6:{n:'Panturrilha no leg press',m:'Panturrilha',s:'8-10|12-15|12-15|12-15|12-15',lab:LAB4,step:5},
  b7:{n:'Elevações laterais',m:'Ombros',eq:EQ3,s:'6-8|6-8|10-12|10-12|12-15',step:1,focus:true,only:['w1','bo']},
  b8:{n:'Pulldown com braços estendidos',m:'Costas',eq:['cabo','corda'],s:'6-8|6-8|10-12|10-12|12-15',step:2.5,focus:true,only:['w1','bo']},
  c8:{n:'Tríceps unilateral no cabo',m:'Tríceps',s:'6-8|6-8|10-12|10-12|12-15',step:2.5,focus:true,only:['w1','bo']},
  c1:{n:'Puxada aberta pronada',m:'Costas',s:'6-8|6-8|10-12|C|10-12',step:2.5},
  c2:{n:'Remada curvada',m:'Costas',s:'6-8|6-8|10-12|10-12|10-12',step:2.5,caution:true},
  c3:{n:'Remada unilateral',m:'Costas',s:'6-8|6-8|10-12|C|10-12',step:2},
  c4:{n:'Remada baixa supinada',m:'Costas',s:'6-8|6-8|10-12|C|10-12',step:2.5},
  c5:{n:'Rosca Scott',m:'Bíceps',s:'6-8|6-8|10-12|C|10-12',step:2.5},
  c6:{n:'Rosca martelo',m:'Bíceps',eq:['cabo','halter','barra livre'],s:'6-8|6-8|10-12|C|10-12',step:2},
  c7:{n:'Abdominal crunch',m:'Abdômen',fixed:{n:4,t:'20 a 30'},block:'abdominal'},
  d1:{n:'Desenvolvimento',m:'Ombros',eq:EQ3,s:'6-8|6-8|10-12|C|10-12',step:2},
  d2:{n:'Elevações laterais',m:'Ombros',eq:EQ3,s:'6-8|6-8|10-12|C|12-15',step:1},
  d3:{n:'Crucifixo inverso',m:'Ombros',s:'6-8|6-8|10-12|C|12-15',step:2.5},
  d4:{n:'Elevações pélvicas',m:'Glúteos',s:'6-8|6-8|10-12|C|10-12',step:5,caution:true},
  d5:{n:'Mesa / cadeira flexora',m:'Posterior',s:'6-8|6-8|10-12|C|12-15',step:2.5},
  d6:{n:'Stiff',m:'Posterior',s:'6-8|6-8|10-12|10-12|12-15',step:5,caution:true},
  d7:{n:'Panturrilha em pé',m:'Panturrilha',s:'8-10|12-15|12-15|12-15|12-15',lab:LAB4,step:5}
};
Object.keys(EX).forEach(id=>{
  const ex=EX[id];ex.id=id;
  if(ex.s){
    ex.cols={};
    ex.s.split('|').forEach((p,i)=>{
      const c=COLS[i].id;
      if(p==='C')ex.cols[c]={cl:true};
      else{const q=p.split('-');ex.cols[c]={lo:+q[0],hi:+q[1],t:q[0]+' a '+q[1]};}
    });
  }
});

const DAYS=[
  {id:'A',title:'Peito, ombro e tríceps',items:['a1','a2','a3','a4','a5','a6','a7','a8']},
  {id:'B',title:'Pernas',items:['b1','b2','b3','b4','b5','b6','b7','b8']},
  {id:'C',title:'Costas e bíceps',items:['c1','c2','c3','c4','c5','c6','c7','c8']},
  {id:'D',title:'Ombros, femorais e panturrilha',items:['d1','d2','d3','d4','d5','d6','d7']}
];

// Dicas de técnica: Delavier, Guia dos Movimentos de Musculação, 2ª ed. (Manole). Parafraseadas; p = página do livro.
// O livro não cita estudos: as ênfases são descrição do autor, não prova de que geram mais crescimento.
const T_LAT={p:'28, 29',t:'Suba até a horizontal: acima disso o trapézio e o deltoide anterior assumem. Varie o ponto de partida do haltere (ao lado, atrás ou na frente das coxas) para pegar todos os feixes do deltoide médio. Nunca muito pesado.'};
const T_FLEX={p:'86, 87',t:'Com a ponta do pé estendida, os posteriores da coxa trabalham mais. Com o pé em flexão (ponta para cima), o gastrocnêmio ajuda mais. Segundo o livro, girar o pé para dentro ou para fora quase não muda nada na prática. O livro descreve isso para a mesa e para a flexora em pé.'};
const TIPS={
  a1:{p:'52, 50',t:'Banco entre 45° e 60°, cotovelos levemente flexionados. No fim, segure um instante com as mãos juntas: o livro diz que a pausa enfatiza a parte esternal do peitoral. No crucifixo com halteres, o livro diz nunca usar carga muito pesada.'},
  a2:{p:'51, 49',t:'Banco até 60°: acima disso o ombro assume o trabalho. Com os halteres face a face no topo, o livro diz que a parte esternal do peitoral trabalha mais. Os halteres deixam descer mais fundo que a barra, o que alonga mais o peitoral.'},
  a3:{p:'42, 43',t:'Pegada mais estreita chama mais a parte central do peitoral; mais larga, a parte externa. Cotovelos junto ao corpo passam trabalho para o deltoide anterior. O livro descreve também arquear as costas para levantar mais carga; como isso aumenta a exigência sobre o tronco, evite por enquanto.'},
  a4:{p:'46, 54',t:'No supino declinado, o livro diz que os feixes inferiores do peitoral trabalham mais. No crucifixo em pé na polia (crossover), cruzar os braços no fim enfatiza a parte externa do peitoral, e a inclinação do tronco e o ângulo dos braços mudam a ênfase.'},
  a5:T_LAT,
  a6:{p:'18, 19',t:'Com o braço na vertical, a porção longa do tríceps fica alongada e trabalha mais. Não arqueie as costas: o livro manda contrair a cintura abdominal para isso e usar, se possível, banco com encosto baixo. Expire no esforço.'},

/* ---------- estado ---------- */
let storageOk=true;
function readStore(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){storageOk=false;return null;}}
function writeStore(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOk=false;}}
try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t');}catch(e){storageOk=false;}

function defaultCfg(){return {focus:true,cols:{f1:true,f2:false,w1:true,w2:true,bo:true}};}
function mergeCfg(c){
  const base=defaultCfg();
  if(c&&typeof c.focus==='boolean')base.focus=c.focus;
  if(c&&c.cols&&typeof c.cols==='object')COLS.forEach(k=>{if(typeof c.cols[k.id]==='boolean')base.cols[k.id]=c.cols[k.id];});
  if(!COLS.some(k=>base.cols[k.id]))base.cols.w1=true;
  return base;
}
function loadState(){
  const base={v:2,sessions:[],released:{},medNote:'',lastBackup:null,draft:null,cfg:defaultCfg()};
  const raw=readStore();
  if(!raw||typeof raw!=='object')return base;
  base.sessions=Array.isArray(raw.sessions)?raw.sessions.filter(s=>s&&Array.isArray(s.entries)):[];
  base.released=raw.released&&typeof raw.released==='object'?raw.released:{};
  base.medNote=typeof raw.medNote==='string'?raw.medNote:'';
  base.lastBackup=typeof raw.lastBackup==='number'?raw.lastBackup:null;
  base.cfg=mergeCfg(raw.cfg);
  if(raw.draft&&Array.isArray(raw.draft.entries)&&DAYS.some(p=>p.id===raw.draft.dayId)){
    raw.draft.entries=raw.draft.entries.filter(e=>e&&EX[e.ex]&&Array.isArray(e.sets)&&e.sets.length);
    if(raw.draft.entries.length)base.draft=raw.draft;
  }
  return base;
}
let S=loadState();

/* ---------- lógica ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>parseFloat(String(v==null?'':v).replace(',','.'));
const fmtKg=n=>(Math.round(n*10)/10).toString().replace('.',',');
const fmtDate=ts=>new Date(ts).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
const daysSince=ts=>Math.floor((Date.now()-ts)/86400000);
const colName=(ex,c)=>(ex.lab&&ex.lab[c])||COLN[c].nm;

function activeCols(){return COLS.filter(c=>S.cfg.cols[c.id]).map(c=>c.id);}
function colsFor(ex){
  const a=activeCols();
  if(!ex.only)return a;
  const r=a.filter(c=>ex.only.includes(c));
  return r.length?r:ex.only.slice();
}
function skipEx(ex){return !!((ex.block&&!S.released[ex.block])||(ex.focus&&!S.cfg.focus));}
function exBlocked(ex,eq){
  if(ex.block&&!S.released[ex.block])return ex.block;
  if(ex.eqBlock&&eq&&ex.eqBlock[eq]&&!S.released[ex.eqBlock[eq]])return ex.eqBlock[eq];
  return null;
}
function lastEntry(exId,eq){
  for(let i=S.sessions.length-1;i>=0;i--){
    const e=(S.sessions[i].entries||[]).find(x=>x.ex===exId&&(!eq||x.eq===eq)&&Array.isArray(x.sets)&&x.sets.some(s=>s.reps>0));
    if(e)return e;
  }
  return null;
}
function lastEqUsed(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const e=(S.sessions[i].entries||[]).find(x=>x.ex===exId&&x.eq);
    if(e)return e.eq;
  }
  return null;
}
function defaultEq(ex){
  if(!ex.eq)return null;
  const last=lastEqUsed(ex.id);
  if(last&&ex.eq.includes(last)&&!exBlocked(ex,last))return last;
  return ex.eq.find(q=>!exBlocked(ex,q))||ex.eq[0];
}
function makeSets(ex){
  if(ex.fixed)return Array.from({length:ex.fixed.n},()=>({col:'fx',kg:'',reps:''}));
  return colsFor(ex).map(c=>({col:c,kg:'',reps:''}));
}
function buildEntries(dayId){
  const day=DAYS.find(d=>d.id===dayId);const out=[];
  day.items.forEach(id=>{
    const ex=EX[id];
    if(skipEx(ex))return;
    out.push({ex:id,eq:defaultEq(ex),sets:makeSets(ex),bulge:false});
  });
  return out;
}
function dayMinutes(day){
  let m=WARM_MIN;
  day.items.forEach(id=>{
    const ex=EX[id];
    if(skipEx(ex))return;
    if(ex.fixed)m+=ex.fixed.n*1.5;
    else colsFor(ex).forEach(c=>{m+=COLN[c].min;});
  });
  return Math.round(m);
}
function nextDayId(){
  if(!S.sessions.length)return 'A';
  const last=S.sessions[S.sessions.length-1].day;
  const i=DAYS.findIndex(p=>p.id===last);
  return DAYS[(i<0?-1:i)+1>=DAYS.length?0:(i<0?-1:i)+1].id;
}

function suggest(ex,eq){
  const e=lastEntry(ex.id,eq);
  const eqTxt=eq?` (${eq})`:'';
  if(!e)return {kind:'first',text:`Primeira vez neste exercício${eqTxt}: anote a carga de cada série. Na próxima vez o app mostra a última carga e sugere a progressão.`};
  const done=e.sets.filter(s=>s.reps>0);
  if(ex.fixed||!ex.cols){
    const kg=Math.max(...done.map(s=>s.kg||0));
    return {kind:'hold',text:`Última vez: ${kg>0?fmtKg(kg)+' kg':'sem carga anotada'}, ${done.length} séries.`};
  }
  const main=done.find(s=>s.col==='w1')||done.find(s=>s.col==='bo')||done[done.length-1];
  const spec=ex.cols[main.col];
  const nm=colName(ex,main.col);
  const at=main.kg>0?`${fmtKg(main.kg)} kg`:'a mesma carga';
  if(e.bulge)return {kind:'bulge',text:`Na última vez a crista apareceu. Repita ${at} (ou reduza), controle a respiração e não suba a carga ainda.`};
  if(!spec||spec.cl)return {kind:'hold',text:`Última vez (${nm}): ${at} × ${main.reps}.`};
  if(main.reps>=spec.hi&&ex.step>0&&main.kg>0){
    const up=main.kg+ex.step;
    return {kind:'up',text:`${nm} da última vez: ${at} × ${main.reps}, no topo da faixa. Suba para ${fmtKg(up)} kg e busque ${spec.lo} repetições.`};
  }
  if(main.reps<spec.lo)return {kind:'hold',text:`${nm} da última vez: ${at} × ${main.reps}, abaixo da faixa de ${spec.t}. Mantenha ou reduza um pouco até chegar em ${spec.lo}.`};
  const target=Math.min(main.reps+1,spec.hi);
  return {kind:'hold',text:`${nm} da última vez: ${at} × ${main.reps}. Mantenha a carga e busque ${target} repetições.`};
}
function kgPlaceholder(ex,eq,col){
  const e=lastEntry(ex.id,eq);
  if(!e)return 'kg';
  const s=e.sets.find(x=>x.col===col&&x.reps>0);
  return s&&s.kg>0?fmtKg(s.kg):'kg';
}
function setLabel(ex,s,j){
  if(s.col==='fx')return {n:`Série ${j+1}`,t:`${ex.fixed.t} reps`,cl:false};
  if(s.col==='extra')return {n:'Série extra',t:'',cl:false};
  const spec=ex.cols[s.col];
  let t=spec.cl?'cluster: 3 ou 4 blocos de 3 ou 4':`${spec.t} reps`;
  if(!ex.lab&&s.col==='w2')t+=' · intervalo 2 a 3 min';
  if(!ex.lab&&s.col==='bo')t+=' · intervalo 1 a 2 min';
  return {n:colName(ex,s.col),t,cl:!!spec.cl};
}

/* ---------- interface ---------- */
const app=document.getElementById('app');
const toastEl=document.getElementById('toast');
const ui={tab:'treino',dayId:nextDayId(),confirmDiscard:false,confirmDel:null,restore:null,restoreText:'',restoreMsg:'',tips:{}};
let toastTimer=null;
function toast(msg){
  toastEl.textContent=msg;toastEl.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastEl.hidden=true;},3200);
}

function banners(){
  let h='';
  if(!storageOk)h+=`<div class="note bad"><b>Não consegui guardar neste navegador.</b> O que você registrar some ao fechar a página. Copie o backup na aba Dados antes de sair.</div>`;
  const n=RESTR.filter(r=>!S.released[r.id]).length;
  if(n)h+=`<div class="note warn">${n===1?'1 restrição ativa':n+' restrições ativas'} por precaução. <a href="#regras">Ver em Regras</a></div>`;
  if(S.sessions.length){
    if(S.lastBackup==null)h+=`<div class="note">Seus treinos ficam só neste navegador e você ainda não copiou um backup. <a href="#dados">Fazer agora</a></div>`;
    else if(daysSince(S.lastBackup)>=7)h+=`<div class="note">Faz ${daysSince(S.lastBackup)} dias desde o último backup. <a href="#dados">Copiar de novo</a></div>`;
  }
  return h;
}

function tipHtml(id){
  const tp=TIPS[id];
  if(!tp)return '';
  const open=!!ui.tips[id];
  let h=`<button type="button" class="tipbtn" data-act="tip" data-id="${id}" aria-expanded="${open}"><span>Dica de técnica</span><small>livro, p. ${esc(tp.p)}</small></button>`;
  if(open){
    h+=`<div class="tip"><p>${esc(tp.t)}</p>`;
    if(EX[id].caution)h+=`<p class="tipc">Cautela até o cirurgião liberar: carga moderada, expire durante o esforço e não prenda o ar. Se a crista aparecer, reduza a carga ou pare o exercício.</p>`;
    h+=`</div>`;
  }
  return h;
}

function viewTreino(){
  const d=S.draft;
  const dayId=d?d.dayId:ui.dayId;
  const day=DAYS.find(p=>p.id===dayId);
  const entries=d?d.entries:buildEntries(dayId);
  const sugDay=nextDayId();
  const total=entries.reduce((a,e)=>a+e.sets.length,0);
  let h=banners();
  h+=`<div class="chips" role="group" aria-label="Escolher o treino do dia">`+DAYS.map(p=>
    `<button type="button" class="chip${p.id===dayId?' on':''}" data-act="day" data-id="${p.id}"${d&&p.id!==dayId?' disabled':''}>${p.id}${(!d&&p.id===sugDay)?'<small>próximo</small>':''}</button>`).join('')+`</div>`;
  const mins=dayMinutes(day);
  h+=`<p class="meta"><b>Treino ${day.id}</b> · ${esc(day.title)} · ${total} séries · cerca de ${mins} min${mins>LIMIT_MIN?' <span class="tag bad">acima de 1h</span>':''}</p>`;
  h+=`<p class="warm muted">Aquecimento no primeiro exercício: 2 séries de 15 a 20 repetições, leves.</p>`;
  h+=`<div class="stack" style="margin-top:12px">`;
  entries.forEach((e,i)=>{
    const ex=EX[e.ex];
    const sg=suggest(ex,e.eq);
    h+=`<article class="card">
      <div class="ex-head"><h3>${esc(ex.n)}</h3><span class="tag">${esc(ex.m)}</span>${ex.focus?'<span class="tag ok">foco</span>':''}${ex.caution?'<span class="tag warn">cautela</span>':''}</div>`;
    if(ex.eq){
      h+=`<div class="eqrow"><label for="eq-${i}">Equipamento</label><select id="eq-${i}" data-f="eq" data-i="${i}">`+ex.eq.map(q=>{
        const b=!!exBlocked(ex,q);
        return `<option value="${esc(q)}"${q===e.eq?' selected':''}${b&&q!==e.eq?' disabled':''}>${esc(q)}${b?' (bloqueado)':''}</option>`;
      }).join('')+`</select></div>`;
    }
    h+=`<p class="sug ${sg.kind}">${esc(sg.text)}</p>`;
    h+=`<div class="sets">`+e.sets.map((s,j)=>{
      const lb=setLabel(ex,s,j);
      const ph=s.col==='fx'||s.col==='extra'?'kg':kgPlaceholder(ex,e.eq,s.col);
      return `<div class="set"><div class="sl"><b>${esc(lb.n)}</b><span>${esc(lb.t)}</span></div>
        <div class="si"><input class="num" type="text" inputmode="decimal" id="kg-${i}-${j}" data-f="kg" data-i="${i}" data-j="${j}" value="${esc(s.kg)}" placeholder="${esc(ph)}" aria-label="Carga em kg, ${esc(lb.n)}">
        <span class="x">×</span>
        <input class="num" type="text" inputmode="numeric" id="rp-${i}-${j}" data-f="reps" data-i="${i}" data-j="${j}" value="${esc(s.reps)}" placeholder="${lb.cl?'total':'reps'}" aria-label="Repetições, ${esc(lb.n)}"></div></div>`;
    }).join('')+`</div>`;
    h+=`<div class="sets-actions">
        <button type="button" class="btn small" data-act="addset" data-i="${i}">+ série</button>
        <button type="button" class="btn small" data-act="delset" data-i="${i}"${e.sets.length<=1?' disabled':''}>− série</button>
        <button type="button" class="btn small" data-act="rest" data-i="${i}">⏱ Descanso</button>
      </div>
      <label class="chk"><input type="checkbox" id="bulge-${i}" data-f="bulge" data-i="${i}"${e.bulge?' checked':''}><span>A crista apareceu neste exercício</span></label>
      ${tipHtml(e.ex)}
    </article>`;
  });
  h+=`</div>`;
  const off=day.items.filter(id=>EX[id].block&&!S.released[EX[id].block]);
  if(off.length)h+=`<div class="note warn">Fora do treino por precaução: ${off.map(id=>esc(EX[id].n)).join(', ')}. Em <a href="#regras">Regras</a> você marca como liberado quando o médico autorizar.</div>`;
  h+=`<div class="row" style="margin-top:20px"><button type="button" class="btn primary" data-act="save" style="flex:1 1 200px">Salvar treino</button>`;
  if(d){
    h+=ui.confirmDiscard
      ?`<button type="button" class="btn danger" data-act="discard-yes">Descartar mesmo</button><button type="button" class="btn" data-act="discard-no">Manter</button>`
      :`<button type="button" class="btn" data-act="discard">Descartar rascunho</button>`;
  }
  h+=`</div>`;
  return h;
}

function viewPlano(){
  let h=`<p class="muted" style="margin-top:12px">Planilha Treino Intermediário Masculino, semanas 5 a 8. Rodízio A, B, C, D: depois de salvar um treino, o próximo da fila vira o "próximo" na aba Treino. Para mudar exercícios, peça a mudança na conversa.</p>`;
  h+=`<h2>Séries que entram no treino</h2>
    <p class="muted">A planilha tem 5 séries por exercício. Marque as que você faz. Vale a partir do próximo treino que você abrir.</p>
    <section class="card" style="margin-top:10px">`+COLS.map(c=>
      `<label class="rel" for="col-${c.id}"><input type="checkbox" id="col-${c.id}" data-f="col" data-id="${c.id}"${S.cfg.cols[c.id]?' checked':''}><span><b>${c.nm}</b><small>${esc(c.info)}</small></span></label>`).join('')+`</section>
    <p class="muted" style="margin-top:8px;font-size:15px">Você contou que faz 4 séries por exercício, então deixei o Feeder 2 desligado. Se você corta outra, troque aqui.</p>`;
  h+=`<h2>Foco: ombros, dorsais e tríceps</h2>
    <section class="card" style="margin-top:10px"><label class="rel" for="focus"><input type="checkbox" id="focus" data-f="focus"${S.cfg.focus?' checked':''}><span><b>Incluir os 3 exercícios extras de foco</b><small>Elevações laterais e pulldown no treino B, tríceps unilateral no cabo no treino C. Cada um com 2 séries (Working 1 e Back-off). Não são da planilha do Júlio.</small></span></label></section>`;
  h+=`<h2>Os 4 treinos</h2><div class="stack">`+DAYS.map(d=>{
    const mins=dayMinutes(d);
    return `<section class="card"><div class="day-head"><h3>Treino ${d.id} · ${esc(d.title)}</h3><small>cerca de ${mins} min${mins>LIMIT_MIN?' (acima de 1h)':''}</small></div>
      <ul class="list">`+d.items.map(id=>{
        const ex=EX[id];
        const b=ex.block&&!S.released[ex.block];
        if(ex.focus&&!S.cfg.focus)return '';
        let sr;
        if(ex.fixed)sr=`${ex.fixed.n} × ${ex.fixed.t}`;
        else sr=colsFor(ex).map(c=>ex.cols[c].cl?'cluster':ex.cols[c].t).join(' · ');
        return `<li><span class="nm">${esc(ex.n)}${ex.eq?`<small>${esc(ex.eq.join(' / '))}</small>`:''}${ex.focus?' <span class="tag ok">foco</span>':''}${ex.caution?' <span class="tag warn">cautela</span>':''}${b?' <span class="tag bad">bloqueado</span>':''}</span><span class="sr">${esc(sr)}</span></li>`;
      }).join('')+`</ul></section>`;
  }).join('')+`</div>`;
  h+=`<p class="muted" style="margin-top:10px;font-size:15px">A estimativa de tempo soma 5 min de aquecimento mais um tempo por série (1,5 min nos feeders e no back-off, 2 no Working 1 e 3 no Working 2). É uma suposição calibrada para 4 séries por exercício caber em cerca de 1 hora.</p>`;
  return h;
}

  let h=`<div class="note bad" style="margin-top:14px"><b>Pare e procure atendimento</b> se aparecer dor nova na barriga, caroço que não volta ao relaxar, vermelhidão ou calor no local, ou náusea e vômito junto com dor. Este app não substitui avaliação médica nem de fisioterapeuta.</div>`;
  h+=`<h2>Restrições de precaução</h2><p class="muted">Ficam ativas até o cirurgião examinar você. Marque como liberado só o que ele autorizar.</p>`;
  h+=`<section class="card" style="margin-top:10px">`+RESTR.map(r=>
    `<label class="rel" for="rel-${r.id}"><input type="checkbox" id="rel-${r.id}" data-f="rel" data-id="${r.id}"${S.released[r.id]?' checked':''}><span><b>Liberado pelo médico:</b> ${esc(r.t)}<small>${esc(r.why)}</small></span></label>`).join('')+`</section>`;
  h+=`<h2>O que o médico disse</h2><textarea id="mednote" data-f="mednote" rows="4" placeholder="Anote aqui a orientação do cirurgião ou do fisioterapeuta, com a data.">${esc(S.medNote)}</textarea>`;

    const tg=TAGS[r.tag];

      (r.src.length?`<ul class="src">`+r.src.map(s=>s.u?`<li><a href="${esc(s.u)}" target="_blank" rel="noopener noreferrer">${esc(s.l)}</a></li>`:`<li>${esc(s.l)}</li>`).join('')+`</ul>`:'')+`</div>`;
  }).join('');

function backupJson(){
  return JSON.stringify({app:'caderno-treino',v:2,exportedAt:Date.now(),data:{sessions:S.sessions,released:S.released,medNote:S.medNote,cfg:S.cfg}});
}

function viewDados(){
  let h='';
  if(!storageOk)h+=`<div class="note bad"><b>Não consegui guardar neste navegador.</b> Copie o backup agora para não perder o que registrou.</div>`;
  h+=`<h2 style="margin-top:14px">Backup</h2>
    <p class="muted">Seus treinos ficam só neste navegador. Limpar os dados do navegador apaga tudo. Copie o backup e cole numa nota do celular de vez em quando.</p>
    <p style="margin-top:8px"><small>${S.lastBackup?`Último backup copiado: ${new Date(S.lastBackup).toLocaleDateString('pt-BR')}`:'Nenhum backup copiado ainda.'}</small></p>
    <div class="row" style="margin-top:10px"><button type="button" class="btn primary" data-act="copy">Copiar backup</button></div>
    <details id="bk-det"><summary>Ver o texto do backup</summary><div class="inner"><textarea id="bk-out" readonly rows="4">${esc(backupJson())}</textarea></div></details>`;
  h+=`<h2>Restaurar</h2><p class="muted">Cole aqui um backup copiado antes. Ele substitui o que está salvo agora.</p>
    <textarea id="bk-in" data-f="bkin" rows="4" style="margin-top:10px" placeholder="Cole o texto do backup">${esc(ui.restoreText)}</textarea>`;
  if(ui.restore){
    h+=`<div class="note warn">Backup válido: ${ui.restore.n} treino(s). Isso apaga os ${S.sessions.length} treino(s) atuais.</div>
      <div class="row" style="margin-top:10px"><button type="button" class="btn danger" data-act="restore-yes">Substituir pelos dados do backup</button><button type="button" class="btn" data-act="restore-no">Cancelar</button></div>`;
  }else{
    h+=`<div class="row" style="margin-top:10px"><button type="button" class="btn" data-act="restore-check">Conferir backup</button></div>`;
    if(ui.restoreMsg)h+=`<p style="margin-top:8px;color:var(--bad)">${esc(ui.restoreMsg)}</p>`;
  }
  h+=`<h2>Histórico</h2>`;
  if(!S.sessions.length){
    h+=`<p class="muted">Nenhum treino salvo ainda. Faça o primeiro na aba Treino e ele aparece aqui, com as cargas para você comparar no próximo.</p>`;
  }else{
    h+=S.sessions.slice().reverse().map(s=>{
      const sets=s.entries.reduce((a,e)=>a+e.sets.filter(x=>x.reps>0).length,0);
      const flags=s.entries.filter(e=>e.bulge).length;
      const body=s.entries.map(e=>{
        const ex=EX[e.ex];
        const line=e.sets.filter(x=>x.reps>0).map(x=>{
          const sh=COLN[x.col]?COLN[x.col].sh:'';
          return `${sh?sh+' ':''}${x.kg>0?fmtKg(x.kg)+'×':''}${x.reps}`;
        }).join(' · ');
        return `<div class="hist-line"><span>${esc(ex?ex.n:e.ex)}${e.eq?' ('+esc(e.eq)+')':''}${e.bulge?' <span class="tag warn">crista</span>':''}</span><span>${esc(line)}</span></div>`;
      }).join('');
      const del=ui.confirmDel===s.id
        ?`<div class="row" style="margin-top:8px"><button type="button" class="btn danger small" data-act="del-yes" data-id="${s.id}">Apagar este treino</button><button type="button" class="btn small" data-act="del-no">Manter</button></div>`
        :`<div class="row" style="margin-top:8px"><button type="button" class="btn small" data-act="del" data-id="${s.id}">Apagar</button></div>`;
      return `<details><summary>${esc(fmtDate(s.ts))} · ${esc(s.dayTitle||s.day)} · ${sets} séries${flags?` · crista em ${flags}`:''}</summary><div class="inner">${body}${del}</div></details>`;
    }).join('');
  }
  return h;
}

const TABS=[['treino','Treino'],['plano','Plano'],['regras','Regras'],['dados','Dados']];
const SUBS={treino:'Registre as séries. A sugestão de carga vem do último treino.',plano:'Os 4 treinos e as séries que entram.',regras:'Por que o plano é assim, e o que ainda depende do médico.',dados:'Backup e histórico.'};

function render(){
  const views={treino:viewTreino,plano:viewPlano,regras:viewRegras,dados:viewDados};
  app.innerHTML=
    `<header><h1>Mjölnir</h1><p class="runes" aria-hidden="true">ᛗᛃᛟᛚᚾᛁᚱ</p><p class="sub">${SUBS[ui.tab]}</p></header>`+
    `<main>${views[ui.tab]()}</main>`+
    `<nav class="nav" aria-label="Seções">`+TABS.map(([id,l])=>`<a href="#${id}"${ui.tab===id?' aria-current="page"':''}>${l}</a>`).join('')+`</nav>`;
}
function renderKeepFocus(){
  const a=document.activeElement;
  const id=a&&a.id?a.id:null;
  render();
  if(id){const el=document.getElementById(id);if(el){el.focus();try{const n=el.value.length;el.setSelectionRange(n,n);}catch(e){}}}
}
function routeFromHash(){
  const h=(location.hash||'').replace('#','');
  ui.tab=TABS.some(t=>t[0]===h)?h:'treino';
}


/* ---------- cronômetro de descanso ----------
   Guarda o instante final (não vai contando de 1 em 1), então continua certo se o celular bloquear a tela. */
const tb=document.getElementById('timer-bar');
const tdisp=document.getElementById('timer-display');
const tlab=document.getElementById('timer-label');
const tpause=document.getElementById('timer-pause-btn');
const T={mode:'off',end:0,left:0,total:0,iv:null,name:'',ctx:null};
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function timerPaint(){
  if(!tb)return;
  tb.classList.toggle('hidden',T.mode==='off');
  tb.classList.toggle('done',T.mode==='done');
  tdisp.textContent=mmss(T.left);
  tlab.textContent=T.mode==='done'?'Descanso acabou':(T.mode==='paused'?'Pausado':'Descanso'+(T.name?' · '+T.name:''));
  tpause.textContent=T.mode==='paused'?'Continuar':(T.mode==='done'?'Repetir':'Pausar');
}
function beep(){
  try{
    if(T.ctx){
      [0,0.25,0.5].forEach(d=>{
        const o=T.ctx.createOscillator(),g=T.ctx.createGain();
        o.frequency.value=880;g.gain.value=0.2;o.connect(g);g.connect(T.ctx.destination);
        o.start(T.ctx.currentTime+d);o.stop(T.ctx.currentTime+d+0.15);
      });
    }
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([300,150,300]);}catch(e){}
}
function timerTick(){
  if(T.mode!=='run')return;
  T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  if(T.left<=0){T.mode='done';clearInterval(T.iv);T.iv=null;beep();}
  timerPaint();
}
function startTimer(sec,name){
  try{if(!T.ctx&&(window.AudioContext||window.webkitAudioContext))T.ctx=new (window.AudioContext||window.webkitAudioContext)();if(T.ctx&&T.ctx.resume)T.ctx.resume();}catch(e){}
  clearInterval(T.iv);
  T.total=sec;T.left=sec;T.end=Date.now()+sec*1000;T.mode='run';
  if(name!==undefined)T.name=name||'';
  T.iv=setInterval(timerTick,250);
  timerPaint();
}
function timerAct(a){
  if(a==='stop'){clearInterval(T.iv);T.iv=null;T.mode='off';T.left=0;timerPaint();return;}
  if(/^s\d+$/.test(a)){startTimer(+a.slice(1));return;}
  if(a==='add'){
    if(T.mode==='run'){T.end+=30000;T.total+=30;timerTick();}
    else if(T.mode==='paused'){T.left+=30;T.total+=30;timerPaint();}
    else startTimer(30);
    return;
  }
  if(a==='pause'){
    if(T.mode==='run'){timerTick();if(T.mode==='run'){clearInterval(T.iv);T.iv=null;T.mode='paused';timerPaint();}}
    else if(T.mode==='paused'){T.end=Date.now()+T.left*1000;T.mode='run';T.iv=setInterval(timerTick,250);timerPaint();}
    else if(T.mode==='done')startTimer(T.total||90);
  }
}
if(tb)tb.addEventListener('click',ev=>{const b=ev.target.closest('[data-t]');if(b)timerAct(b.dataset.t);});
document.addEventListener&&document.addEventListener('visibilitychange',timerTick);

/* ---------- ações ---------- */
function ensureDraft(){
  if(S.draft)return false;
  S.draft={dayId:ui.dayId,startedAt:Date.now(),entries:buildEntries(ui.dayId)};
  return true;
}
function saveSession(){
  const src=S.draft?S.draft.entries:buildEntries(ui.dayId);
  const dayId=S.draft?S.draft.dayId:ui.dayId;
  const entries=[];
  src.forEach(e=>{
    const sets=[];
    e.sets.forEach(s=>{
      const reps=parseInt(String(s.reps).trim(),10);
      if(reps>0){const kg=num(s.kg);sets.push({col:s.col,kg:isNaN(kg)||kg<0?0:kg,reps});}
    });
    if(sets.length)entries.push({ex:e.ex,eq:e.eq||null,sets,bulge:!!e.bulge});
  });
  if(!entries.length){toast('Preencha as repetições de pelo menos uma série.');return;}
  const day=DAYS.find(p=>p.id===dayId);
  S.sessions.push({id:Date.now(),ts:Date.now(),day:dayId,dayTitle:`Treino ${day.id} · ${day.title}`,entries});
  S.draft=null;ui.confirmDiscard=false;
  ui.dayId=nextDayId();
  writeStore();render();window.scrollTo(0,0);
  toast('Treino salvo.');
}

app.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(!t||t.disabled)return;
  const act=t.dataset.act;
  if(act==='day'){ui.dayId=t.dataset.id;render();return;}
  if(act==='tip'){ui.tips[t.dataset.id]=!ui.tips[t.dataset.id];render();return;}
  if(act==='addset'||act==='delset'){
    ensureDraft();
    const e=S.draft.entries[+t.dataset.i];
    if(act==='addset')e.sets.push({col:'extra',kg:'',reps:''});else if(e.sets.length>1)e.sets.pop();
    writeStore();render();return;
  }
  if(act==='rest'){
    const en=(S.draft?S.draft.entries:buildEntries(ui.dayId))[+t.dataset.i];
    const nx=en.sets.find(x=>!(parseInt(String(x.reps).trim(),10)>0))||en.sets[en.sets.length-1];
    const ex=EX[en.ex];
    startTimer(ex.lab&&nx.col!=='extra'?60:(REST[nx.col]||90),ex.n);
    return;
  }
  if(act==='save'){saveSession();return;}
  if(act==='discard'){ui.confirmDiscard=true;render();return;}
  if(act==='discard-no'){ui.confirmDiscard=false;render();return;}
  if(act==='discard-yes'){S.draft=null;ui.confirmDiscard=false;writeStore();render();toast('Rascunho descartado.');return;}
  if(act==='copy'){
    const txt=backupJson();
    const fallback=()=>{
      const det=document.getElementById('bk-det');if(det)det.open=true;
      const ta=document.getElementById('bk-out');if(ta){ta.focus();ta.select();}
      toast('Não consegui copiar sozinho. O texto está selecionado: copie manualmente.');
    };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>{S.lastBackup=Date.now();writeStore();render();toast('Backup copiado. Cole numa nota.');}).catch(fallback);
    }else fallback();
    return;
  }
  if(act==='restore-check'){
    ui.restoreMsg='';
    try{
      const o=JSON.parse(ui.restoreText);
      if(!o||o.app!=='caderno-treino'||!o.data||!Array.isArray(o.data.sessions))throw new Error('formato');
      ui.restore={n:o.data.sessions.length,obj:o.data};
    }catch(e){ui.restore=null;ui.restoreMsg='Esse texto não parece um backup do Caderno de Treino. Cole o texto inteiro, do início ao fim.';}
    render();return;
  }
  if(act==='restore-no'){ui.restore=null;render();return;}
  if(act==='restore-yes'){
    const d=ui.restore.obj;
    S.sessions=d.sessions.filter(s=>s&&Array.isArray(s.entries));
    S.released=d.released&&typeof d.released==='object'?d.released:{};
    S.medNote=typeof d.medNote==='string'?d.medNote:'';
    S.cfg=mergeCfg(d.cfg);
    ui.restore=null;ui.restoreText='';ui.dayId=nextDayId();
    writeStore();render();toast('Backup restaurado.');return;
  }
  if(act==='del'){ui.confirmDel=+t.dataset.id;render();return;}
  if(act==='del-no'){ui.confirmDel=null;render();return;}
  if(act==='del-yes'){
    const id=+t.dataset.id;S.sessions=S.sessions.filter(s=>s.id!==id);
    ui.confirmDel=null;ui.dayId=nextDayId();writeStore();render();toast('Treino apagado.');return;
  }
});

app.addEventListener('input',ev=>{
  const t=ev.target,f=t.dataset&&t.dataset.f;
  if(f==='kg'||f==='reps'){
    const created=ensureDraft();
    S.draft.entries[+t.dataset.i].sets[+t.dataset.j][f]=t.value;
    writeStore();
    if(created)renderKeepFocus();
  }else if(f==='mednote'){S.medNote=t.value;writeStore();}
  else if(f==='bkin'){ui.restoreText=t.value;}
});
app.addEventListener('change',ev=>{
  const t=ev.target,f=t.dataset&&t.dataset.f;
  if(f==='bulge'){
    const created=ensureDraft();
    S.draft.entries[+t.dataset.i].bulge=t.checked;
    writeStore();
    if(created)renderKeepFocus();
  }else if(f==='eq'){
    ensureDraft();
    S.draft.entries[+t.dataset.i].eq=t.value;
    writeStore();renderKeepFocus();
  }else if(f==='rel'){
    S.released[t.dataset.id]=t.checked;writeStore();
  }else if(f==='focus'){
    S.cfg.focus=t.checked;writeStore();render();
  }else if(f==='col'){
    S.cfg.cols[t.dataset.id]=t.checked;
    if(!COLS.some(k=>S.cfg.cols[k.id])){S.cfg.cols[t.dataset.id]=true;toast('Deixe pelo menos uma série ligada.');}
    writeStore();render();
  }
});
window.addEventListener('hashchange',()=>{routeFromHash();render();window.scrollTo(0,0);});

window.__caderno={timer:{start:startTimer,act:timerAct,T},EX,DAYS,TIPS,COLS,suggest,dayMinutes,buildEntries,activeCols,exBlocked,backupJson,nextDayId,state:()=>S,go:tab=>{ui.tab=tab;render();return app.innerHTML;},save:saveSession,ui};

routeFromHash();
render();
})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}

</script>
